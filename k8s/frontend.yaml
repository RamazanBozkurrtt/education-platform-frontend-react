apiVersion: v1
kind: Namespace
metadata:
  name: edubase
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: edubase
data:
  config.js: |
    window.__EDUBASE_CONFIG__ = {
      API_BASE_URL: "http://localhost:30090"
    };
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: edubase
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: edubase/frontend:v7
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: frontend-config
              mountPath: /usr/share/nginx/html/config.js
              subPath: config.js
      volumes:
        - name: frontend-config
          configMap:
            name: frontend-config
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: edubase
  labels:
    app: frontend
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
  type: NodePort
